## 基本的な入力・通信設定
# 入力デバイスとして有効化
CONFIG_INPUT=y
# SPI 通信を有効化
CONFIG_SPI=y
# 外部電源供給を有効化
CONFIG_ZMK_EXT_POWER=y
# ZMK のマウス操作機能を有効化
CONFIG_ZMK_MOUSE=y

## PMW3610 トラックボールセンサー設定
# PMW3610 センサーを有効化
CONFIG_PMW3610=y
# オートマウスモードが解除されるまでの待機時間（ms）
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=60000
# カーソル感度（CPI）を設定
CONFIG_PMW3610_CPI=800
# CPI の分割比を設定
CONFIG_PMW3610_CPI_DIVIDOR=1
# X 方向のスクロールを反転
CONFIG_PMW3610_INVERT_SCROLL_X=y
# Y 方向のスクロールを反転しない
CONFIG_PMW3610_INVERT_SCROLL_Y=n
# センサーの向きを 180° 回転させる
CONFIG_PMW3610_ORIENTATION_180=y
# センサーのポーリングレートを 125 Hz 相当に設定
CONFIG_PMW3610_POLLING_RATE_125_SW=y
# 休止時のサンプル取得間隔を設定
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
# 移動時のダウンサンプリング時間を設定
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
# スクロール反応の間隔を設定
CONFIG_PMW3610_SCROLL_TICK=20
# スナイプモード時の CPI を設定
CONFIG_PMW3610_SNIPE_CPI=800
# スナイプモード時の CPI 分割比を設定
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4
# スマート追跡アルゴリズムを有効化
CONFIG_PMW3610_SMART_ALGORITHM=y
# オートマウスに入るまでの移動距離しきい値
CONFIG_PMW3610_MOVEMENT_THRESHOLD=100

