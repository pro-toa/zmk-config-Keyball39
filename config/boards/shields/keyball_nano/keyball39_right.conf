# 基本的な入力・通信設定
CONFIG_INPUT=y                                 # 入力デバイスとして有効化
CONFIG_SPI=y                                   # SPI 通信を有効化
CONFIG_ZMK_EXT_POWER=y                         # 外部電源供給を有効化
CONFIG_ZMK_MOUSE=y                             # ZMK のマウス操作機能を有効化

# PMW3610 トラックボールセンサー設定
CONFIG_PMW3610=y                               # PMW3610 センサーを有効化
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=1000       # オートマウスモードが解除されるまでの待機時間（ms）
CONFIG_PMW3610_CPI=1200                        # カーソル感度（CPI）を設定
CONFIG_PMW3610_CPI_DIVIDOR=1                   # CPI の分割比を設定
CONFIG_PMW3610_INVERT_SCROLL_X=y               # X 方向のスクロールを反転
CONFIG_PMW3610_INVERT_SCROLL_Y=n               # Y 方向のスクロールを反転しない
CONFIG_PMW3610_ORIENTATION_180=y               # センサーの向きを 180° 回転させる
CONFIG_PMW3610_POLLING_RATE_125_SW=y           # センサーのポーリングレートを 125 Hz 相当に設定
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20         # 休止時のサンプル取得間隔を設定
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264      # 移動時のダウンサンプリング時間を設定
CONFIG_PMW3610_SCROLL_TICK=20                  # スクロール反応の間隔を設定
CONFIG_PMW3610_SNIPE_CPI=400                   # スナイプモード時の CPI を設定
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4             # スナイプモード時の CPI 分割比を設定
CONFIG_PMW3610_SMART_ALGORITHM=y               # スマート追跡アルゴリズムを有効化
CONFIG_PMW3610_MOVEMENT_THRESHOLD=10           # オートマウスに入るまでの移動距離しきい値

