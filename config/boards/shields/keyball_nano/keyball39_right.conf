#CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600   # 休止時のダウンサンプリング時間を調整
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=       # 2段目の休止時ダウンサンプリング時間
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=          # 2段目の休止時サンプル取得間隔
#CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=       # 3段目の休止時ダウンサンプリング時間
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=          # 3段目の休止時サンプル取得間隔

# 追加機能設定
CONFIG_ZMK_STUDIO=y                            # ZMK Studio を有効化
CONFIG_ZMK_STUDIO_LOCKING=n                    # ZMK Studio のロック機能を無効化
